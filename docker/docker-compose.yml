version: '3.8'

services:
  rag-agent:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: antitrust-rag-agent
    volumes:
      - ../data:/app/data
      - ../chroma_db:/app/chroma_db
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_LLM_MODEL=qwen2.5:7b-instruct-q3_K_M
      - OLLAMA_EMBED_MODEL=nomic-embed-text:latest
      - CHUNK_SIZE=1000
      - CHUNK_OVERLAP=200
      - TOP_K_DOCUMENTS=4
    extra_hosts:
      - "host.docker.internal:host-gateway"
    stdin_open: true
    tty: true
